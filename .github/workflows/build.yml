name: Build Brawl AI APK



on:

  push:

  workflow_dispatch:



permissions:

  contents: write



jobs:

  build-apk:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Set up JDK 17

        uses: actions/setup-java@v4

        with:

          distribution: 'temurin'

          java-version: '17'



      - name: Generate Android Overlay Project (Green/Blue/Red Circle + Accel Lead + Small Fast Projectile + Self-Velocity + HP/Ammo Manager)

        run: |

          python3 - << 'EOF'

          import os



          os.makedirs("app/src/main/java/com/brawl/aioverlay", exist_ok=True)

          os.makedirs("app/src/main/res/xml", exist_ok=True)



          with open("settings.gradle.kts", "w") as f:

              f.write('''pluginManagement {

              repositories {

                  google()

                  mavenCentral()

                  gradlePluginPortal()

              }

          }

          dependencyResolutionManagement {

              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {

                  google()

                  mavenCentral()

              }

          }

          rootProject.name = "BrawlAiOverlay"

          include(":app")

          ''')



          with open("build.gradle.kts", "w") as f:

              f.write('''plugins {

              id("com.android.application") version "8.2.2" apply false

              id("org.jetbrains.kotlin.android") version "1.9.22" apply false

          }

          ''')



          with open("gradle.properties", "w") as f:

              f.write('''org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          android.useAndroidX=true

          kotlin.code.style=official

          android.nonTransitiveRClass=true

          ''')



          with open("app/build.gradle.kts", "w") as f:

              f.write('''plugins {

              id("com.android.application")

              id("org.jetbrains.kotlin.android")

          }

          android {

              namespace = "com.brawl.aioverlay"

              compileSdk = 34

              defaultConfig {

                  applicationId = "com.brawl.aioverlay"

                  minSdk = 30

                  targetSdk = 34

                  versionCode = 2

                  versionName = "2.0"

              }

              buildTypes {

                  release {

                      isMinifyEnabled = false

                  }

              }

              compileOptions {

                  sourceCompatibility = JavaVersion.VERSION_17

                  targetCompatibility = JavaVersion.VERSION_17

              }

              kotlinOptions {

                  jvmTarget = "17"

              }

          }

          dependencies {

              implementation("androidx.core:core-ktx:1.12.0")

              implementation("androidx.appcompat:appcompat:1.6.1")

          }

          ''')



          with open("app/src/main/AndroidManifest.xml", "w") as f:

              f.write('''<?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application

                  android:allowBackup="true"

                  android:label="Brawl AI Overlay"

                  android:supportsRtl="true"

                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity

                      android:name=".MainActivity"

                      android:exported="true">

                      <intent-filter>

                          <action android:name="android.intent.action.MAIN" />

                          <category android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

                  <service

                      android:name=".BrawlAccessibilityService"

                      android:exported="true"

                      android:label="Brawl AI 패드 자동 조종"

                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

                      <intent-filter>

                          <action android:name="android.accessibilityservice.AccessibilityService" />

                      </intent-filter>

                      <meta-data

                          android:name="android.accessibilityservice"

                          android:resource="@xml/accessibility_service_config" />

                  </service>

              </application>

          </manifest>

          ''')



          with open("app/src/main/res/xml/accessibility_service_config.xml", "w") as f:

              f.write('''<?xml version="1.0" encoding="utf-8"?>

          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"

              android:accessibilityEventTypes="typeAllMask"

              android:accessibilityFeedbackType="feedbackGeneric"

              android:accessibilityFlags="flagDefault"

              android:canPerformGestures="true"

              android:canTakeScreenshot="true"

              android:canRetrieveWindowContent="false"

              android:notificationTimeout="45" />

          ''')



          with open("app/src/main/java/com/brawl/aioverlay/MainActivity.kt", "w") as f:

              f.write('''package com.brawl.aioverlay



          import android.app.Activity

          import android.content.Intent

          import android.graphics.Color

          import android.graphics.drawable.GradientDrawable

          import android.net.Uri

          import android.os.Bundle

          import android.provider.Settings

          import android.view.Gravity

          import android.widget.Button

          import android.widget.LinearLayout

          import android.widget.TextView

          import android.widget.Toast



          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {

                  super.onCreate(savedInstanceState)



                  val root = LinearLayout(this).apply {

                      orientation = LinearLayout.VERTICAL

                      gravity = Gravity.CENTER

                      setBackgroundColor(Color.parseColor("#080D1A"))

                      setPadding(60, 60, 60, 60)

                  }



                  val cardBg = GradientDrawable().apply {

                      setColor(Color.parseColor("#111827"))

                      cornerRadius = 40f

                      setStroke(3, Color.parseColor("#38BDF8"))

                  }



                  val card = LinearLayout(this).apply {

                      orientation = LinearLayout.VERTICAL

                      background = cardBg

                      setPadding(56, 56, 56, 56)

                  }



                  val title = TextView(this).apply {

                      text = "BRAWL AI OVERLAY v2.0"

                      textSize = 22f

                      setTextColor(Color.WHITE)

                      setPadding(0, 0, 0, 14)

                  }



                  val sub = TextView(this).apply {

                      text = "• 초록(내 캐릭터) / 파랑(아군 제외) / 빨강(적) 원 구분\\n• 빨간 원 속도+가속도 2차 궤적 예측 사격\\n• 소형 고속 탄환 직선 궤도 & 내 이동속도 반영 회피\\n• 내 브롤러 머리 위 HP바·탄창(3칸) 인식 자동 체력관리"

                      textSize = 13f

                      setTextColor(Color.parseColor("#94A3B8"))

                      setPadding(0, 0, 0, 32)

                  }



                  val btn1 = Button(this).apply {

                      text = "1단계: 다른 앱 위에 표시 권한 허용"

                      setOnClickListener {

                          if (!Settings.canDrawOverlays(this@MainActivity)) {

                              startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))

                          } else {

                              Toast.makeText(context, "이미 허용되어 있습니다!", Toast.LENGTH_SHORT).show()

                          }

                      }

                  }



                  val btn2 = Button(this).apply {

                      text = "2단계: 접근성 설정에서 [Brawl AI 패드 자동 조종] 켜기"

                      setOnClickListener {

                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))

                      }

                  }



                  val btn3 = Button(this).apply {

                      text = "3단계: 왼쪽 위 오버레이 창 띄우기 (실행)"

                      setBackgroundColor(Color.parseColor("#10B981"))

                      setTextColor(Color.BLACK)

                      setOnClickListener {

                          if (!Settings.canDrawOverlays(this@MainActivity)) {

                              Toast.makeText(context, "먼저 1단계 권한을 허용해주세요.", Toast.LENGTH_LONG).show()

                              return@setOnClickListener

                          }

                          val svc = BrawlAccessibilityService.instance

                          if (svc == null) {

                              Toast.makeText(context, "먼저 2단계 접근성 설정에서 [Brawl AI 패드 자동 조종]을 켜주세요!", Toast.LENGTH_LONG).show()

                              startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))

                          } else {

                              svc.showFloatingWindow()

                              Toast.makeText(context, "왼쪽 위에 오버레이 창이 떴습니다! 브롤스타즈를 켜세요.", Toast.LENGTH_LONG).show()

                              finish()

                          }

                      }

                  }



                  card.addView(title)

                  card.addView(sub)

                  card.addView(btn1)

                  card.addView(btn2)

                  card.addView(btn3)

                  root.addView(card)

                  setContentView(root)

              }

          }

          ''')



          with open("app/src/main/java/com/brawl/aioverlay/BrawlAccessibilityService.kt", "w") as f:

              f.write('''package com.brawl.aioverlay



          import android.accessibilityservice.AccessibilityService

          import android.accessibilityservice.GestureDescription

          import android.content.Context

          import android.graphics.Bitmap

          import android.graphics.Canvas

          import android.graphics.Color

          import android.graphics.Paint

          import android.graphics.Path

          import android.graphics.PixelFormat

          import android.graphics.drawable.GradientDrawable

          import android.os.Handler

          import android.os.Looper

          import android.view.Display

          import android.view.Gravity

          import android.view.MotionEvent

          import android.view.View

          import android.view.WindowManager

          import android.view.accessibility.AccessibilityEvent

          import android.widget.Button

          import android.widget.LinearLayout

          import android.widget.TextView

          import kotlin.math.abs

          import kotlin.math.atan2

          import kotlin.math.cos

          import kotlin.math.hypot

          import kotlin.math.max

          import kotlin.math.min

          import kotlin.math.sin



          class BrawlAccessibilityService : AccessibilityService() {



              companion object {

                  var instance: BrawlAccessibilityService? = null

              }



              data class FastBlob(val cx: Float, val cy: Float, val pixelCount: Int)

              data class TrackedProjectile(val x: Float, val y: Float, val vx: Float, val vy: Float, val speed: Float)



              private var wm: WindowManager? = null

              private var rootOverlay: LinearLayout? = null

              private var statusText: TextView? = null

              private var hpAmmoText: TextView? = null

              private var aiActive = false

              private var minimized = false



              // 사용자 상단 조이스틱 방향 지시 벡터 (-1..1)

              private var cmdX = 0f

              private var cmdY = 0f



              // 내 브롤러(초록 원) 실시간 위치 및 이동 속도 벡터 (자신이 움직이는 것 고려)

              private var myX = -1f

              private var myY = -1f

              private var myVelX = 0f

              private var myVelY = 0f

              private var lastAppliedMoveX = 0f

              private var lastAppliedMoveY = 0f



              // 내 브롤러 머리 위 HP 비율(0..1) 및 주황색 탄창 칸수(0..3)

              private var myHpRatio = 1.0f

              private var myAmmoBars = 3.0f



              // 상대 브롤러(빨간 원) 위치, 속도(v), 가속도(a) 추적 상태

              private var prevEnemyX = -1f

              private var prevEnemyY = -1f

              private var enemyVelX = 0f

              private var enemyVelY = 0f

              private var enemyAccX = 0f

              private var enemyAccY = 0f



              // 이전 프레임 소형 고속 탄환 블롭 목록 & 밝기 버퍼

              private var prevLuma: IntArray? = null

              private var prevBlobs: List<FastBlob> = emptyList()

              private var lastFrameTimeMs = 0L

              private var lastFireMs = 0L



              private val handler = Handler(Looper.getMainLooper())

              private var loopRunning = false



              override fun onServiceConnected() {

                  super.onServiceConnected()

                  instance = this

                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager

                  showFloatingWindow()

              }



              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}



              fun showFloatingWindow() {

                  if (rootOverlay != null) return



                  val params = WindowManager.LayoutParams(

                      440,

                      WindowManager.LayoutParams.WRAP_CONTENT,

                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,

                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,

                      PixelFormat.TRANSLUCENT

                  ).apply {

                      gravity = Gravity.TOP or Gravity.START

                      x = 24

                      y = 24

                  }



                  val windowBg = GradientDrawable().apply {

                      setColor(Color.parseColor("#E60F172A"))

                      cornerRadius = 38f

                      setStroke(3, Color.parseColor("#38BDF8"))

                  }



                  val container = LinearLayout(this).apply {

                      orientation = LinearLayout.VERTICAL

                      background = windowBg

                      setPadding(24, 18, 24, 22)

                  }



                  val header = LinearLayout(this).apply {

                      orientation = LinearLayout.HORIZONTAL

                      gravity = Gravity.CENTER_VERTICAL

                      setPadding(4, 0, 4, 12)

                  }



                  val titleTv = TextView(this).apply {

                      text = "● BRAWL AI v2 (드래그 이동)"

                      textSize = 11.5f

                      setTextColor(Color.parseColor("#38BDF8"))

                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)

                  }



                  val btnMin = Button(this).apply {

                      text = "—"

                      textSize = 11f

                      setPadding(8, 2, 8, 2)

                      setBackgroundColor(Color.parseColor("#1E293B"))

                      setTextColor(Color.WHITE)

                  }



                  header.addView(titleTv)

                  header.addView(btnMin)



                  var startX = 0

                  var startY = 0

                  var touchX = 0f

                  var touchY = 0f

                  header.setOnTouchListener { _, ev ->

                      when (ev.action) {

                          MotionEvent.ACTION_DOWN -> {

                              startX = params.x

                              startY = params.y

                              touchX = ev.rawX

                              touchY = ev.rawY

                              true

                          }

                          MotionEvent.ACTION_MOVE -> {

                              params.x = startX + (ev.rawX - touchX).toInt()

                              params.y = startY + (ev.rawY - touchY).toInt()

                              wm?.updateViewLayout(container, params)

                              true

                          }

                          else -> false

                      }

                  }



                  val body = LinearLayout(this).apply {

                      orientation = LinearLayout.VERTICAL

                  }



                  val toggleBgOn = GradientDrawable().apply {

                      setColor(Color.parseColor("#10B981"))

                      cornerRadius = 24f

                  }

                  val toggleBgOff = GradientDrawable().apply {

                      setColor(Color.parseColor("#334155"))

                      cornerRadius = 24f

                  }



                  val btnToggle = Button(this).apply {

                      text = "직접 조종: OFF (누르면 시작)"

                      textSize = 12f

                      setTextColor(Color.WHITE)

                      background = toggleBgOff

                      setOnClickListener {

                          aiActive = !aiActive

                          if (aiActive) {

                              text = "● 직접 조종: ON (누르면 멈춤)"

                              setTextColor(Color.BLACK)

                              background = toggleBgOn

                              startControlLoop()

                          } else {

                              text = "직접 조종: OFF (수동 모드)"

                              setTextColor(Color.WHITE)

                              background = toggleBgOff

                              statusText?.text = "상태: 수동 조작 대기 중"

                          }

                      }

                  }



                  val joystickView = object : View(this) {

                      private val ringPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {

                          style = Paint.Style.STROKE

                          strokeWidth = 5f

                          color = Color.parseColor("#38BDF8")

                      }

                      private val bgPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {

                          style = Paint.Style.FILL

                          color = Color.parseColor("#1E293B")

                      }

                      private val knobPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {

                          style = Paint.Style.FILL

                          color = Color.parseColor("#10B981")

                      }

                      private val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {

                          style = Paint.Style.STROKE

                          strokeWidth = 6f

                          color = Color.parseColor("#38BDF8")

                      }



                      override fun onDraw(canvas: Canvas) {

                          super.onDraw(canvas)

                          val cx = width / 2f

                          val cy = height / 2f

                          val r = min(cx, cy) - 14f

                          canvas.drawCircle(cx, cy, r, bgPaint)

                          canvas.drawCircle(cx, cy, r, ringPaint)

                          val kx = cx + cmdX * (r - 22f)

                          val ky = cy + cmdY * (r - 22f)

                          canvas.drawLine(cx, cy, kx, ky, linePaint)

                          canvas.drawCircle(kx, ky, 22f, knobPaint)

                      }



                      override fun onTouchEvent(event: MotionEvent): Boolean {

                          val cx = width / 2f

                          val cy = height / 2f

                          val maxR = min(cx, cy) - 18f

                          when (event.action) {

                              MotionEvent.ACTION_DOWN, MotionEvent.ACTION_MOVE -> {

                                  val dx = event.x - cx

                                  val dy = event.y - cy

                                  val d = hypot(dx, dy)

                                  if (d < 6f) {

                                      cmdX = 0f

                                      cmdY = 0f

                                  } else {

                                      val scale = min(d, maxR) / maxR

                                      cmdX = (dx / d) * scale

                                      cmdY = (dy / d) * scale

                                  }

                                  invalidate()

                              }

                              MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {

                                  cmdX = 0f

                                  cmdY = 0f

                                  invalidate()

                              }

                          }

                          return true

                      }

                  }.apply {

                      layoutParams = LinearLayout.LayoutParams(210, 210).apply {

                          gravity = Gravity.CENTER_HORIZONTAL

                          topMargin = 14

                          bottomMargin = 10

                      }

                  }



                  val hpTv = TextView(this).apply {

                      text = "내 HP: 100% | 탄창: 3.0칸"

                      textSize = 10.5f

                      gravity = Gravity.CENTER

                      setTextColor(Color.parseColor("#34D399"))

                  }

                  hpAmmoText = hpTv



                  val stTv = TextView(this).apply {

                      text = "초록(나)·빨강(적 가속도)·소형탄환 감시"

                      textSize = 10f

                      gravity = Gravity.CENTER

                      setTextColor(Color.parseColor("#CBD5E1"))

                  }

                  statusText = stTv



                  btnMin.setOnClickListener {

                      minimized = !minimized

                      body.visibility = if (minimized) View.GONE else View.VISIBLE

                      btnMin.text = if (minimized) "□" else "—"

                  }



                  body.addView(btnToggle)

                  body.addView(joystickView)

                  body.addView(hpTv)

                  body.addView(stTv)



                  container.addView(header)

                  container.addView(body)



                  rootOverlay = container

                  wm?.addView(container, params)

              }



              private fun startControlLoop() {

                  if (loopRunning) return

                  loopRunning = true

                  lastFrameTimeMs = System.currentTimeMillis()

                  scheduleNextTick()

              }



              private fun scheduleNextTick() {

                  if (!aiActive) {

                      loopRunning = false

                      return

                  }

                  takeScreenshot(

                      Display.DEFAULT_DISPLAY,

                      mainExecutor,

                      object : TakeScreenshotCallback {

                          override fun onSuccess(screenshot: ScreenshotResult) {

                              try {

                                  val hw = screenshot.hardwareBuffer

                                  val bmp = Bitmap.wrapHardwareBuffer(hw, screenshot.colorSpace)

                                      ?.copy(Bitmap.Config.ARGB_8888, false)

                                  hw.close()

                                  if (bmp != null) {

                                      processScreenFrame(bmp)

                                      bmp.recycle()

                                  }

                              } catch (_: Throwable) {

                              }

                              handler.postDelayed({ scheduleNextTick() }, 85L)

                          }



                          override fun onFailure(errorCode: Int) {

                              dispatchPadTouch(cmdX, cmdY, 0f, 0f, false)

                              handler.postDelayed({ scheduleNextTick() }, 110L)

                          }

                      }

                  )

              }



              private fun processScreenFrame(bmp: Bitmap) {

                  val nowMs = System.currentTimeMillis()

                  val dt = ((nowMs - lastFrameTimeMs).coerceIn(40L, 250L)) / 1000f

                  lastFrameTimeMs = nowMs



                  val w = bmp.width

                  val h = bmp.height

                  val step = max(4, w / 180)

                  val gridW = w / step

                  val gridH = h / step

                  val currLuma = IntArray(gridW * gridH)

                  val fastMask = BooleanArray(gridW * gridH)



                  // 1. 초록 원(내 브롤러), 파랑 원(아군 제외), 빨간 원(적 브롤러) 분리 검출

                  var greenSumX = 0f

                  var greenSumY = 0f

                  var greenCnt = 0



                  var redSumX = 0f

                  var redSumY = 0f

                  var redCnt = 0



                  val oldLuma = prevLuma



                  for (gy in 3 until gridH - 3) {

                      val py = gy * step

                      for (gx in 3 until gridW - 3) {

                          val px = gx * step

                          // 왼쪽 위 오버레이 창 영역 제외

                          if (px < 460 && py < 460) continue

                          // 하단 조이스틱 영역 제외

                          if (py > h * 0.72f && (px < w * 0.25f || px > w * 0.75f)) continue



                          val c = bmp.getPixel(px, py)

                          val r = Color.red(c)

                          val g = Color.green(c)

                          val b = Color.blue(c)

                          val luma = (r + g + b) / 3

                          val idx = gy * gridW + gx

                          currLuma[idx] = luma



                          // (A) 내 브롤러 아래 초록 원 감지 (화면 중앙 부근의 밝은 초록 링: G가 높고 R,B보다 뚜렷이 큼)

                          if (px in (w * 0.32f).toInt()..(w * 0.68f).toInt() &&

                              py in (h * 0.30f).toInt()..(h * 0.75f).toInt()) {

                              if (g > 185 && r < 110 && b < 130 && (g - r) > 80) {

                                  greenSumX += px

                                  greenSumY += py

                                  greenCnt++

                              }

                          }



                          // (B) 파랑/하늘색 원(아군 Oschapi-man, YT Kuni 등)은 B>180, G>140, R<90 -> 조준에서 철저히 제외!

                          val isBlueAllyCircle = (b > 175 && g > 120 && r < 95)



                          // (C) 적 브롤러 아래 빨간 원 감지 (R이 매우 높고 G, B가 낮음)

                          if (!isBlueAllyCircle && r > 195 && g < 72 && b < 85 && (r - g) > 125) {

                              redSumX += px

                              redSumY += py

                              redCnt++

                          }



                          // (D) 프레임 간 급격히 움직이는 고휘도 픽셀(탄환 후보) 마스킹

                          if (oldLuma != null && oldLuma.size == currLuma.size) {

                              val diff = abs(luma - oldLuma[idx])

                              if (diff > 58 && (r > 190 || g > 190 || b > 190)) {

                                  fastMask[idx] = true

                              }

                          }

                      }

                  }

                  prevLuma = currLuma



                  // 내 브롤러(초록 원) 중심 좌표 및 내 이동 속도(myVelX, myVelY) 갱신

                  val detectedMyX = if (greenCnt >= 4) (greenSumX / greenCnt) else (w * 0.5f)

                  val detectedMyY = if (greenCnt >= 4) (greenSumY / greenCnt) else (h * 0.54f)



                  // 내가 패드로 이동 중인 속도 벡터 반영 (카메라 이동 + 내 브롤러 실제 이동 속도)

                  val myMaxSpeedPx = w * 0.19f

                  if (myX >= 0f) {

                      val screenShiftVx = (detectedMyX - myX) / dt

                      val screenShiftVy = (detectedMyY - myY) / dt

                      val padVx = lastAppliedMoveX * myMaxSpeedPx

                      val padVy = lastAppliedMoveY * myMaxSpeedPx

                      myVelX = 0.5f * myVelX + 0.5f * (padVx + screenShiftVx * 0.3f)

                      myVelY = 0.5f * myVelY + 0.5f * (padVy + screenShiftVy * 0.3f)

                  }

                  myX = detectedMyX

                  myY = detectedMyY



                  // 2. 내 브롤러(초록 원) 머리 위의 HP 바 및 주황색 3칸 탄창 바 인식

                  scanMyHpAndAmmoBars(bmp, myX, myY, w, h)



                  // 3. 소형 고속 객체(탄환) 클러스터링: 크기가 작은 것만 탄환으로 인식하고 큰 캐릭터/이펙트는 제외

                  val currBlobs = extractSmallProjectileBlobs(fastMask, gridW, gridH, step)

                  val projectiles = matchAndTrackProjectiles(currBlobs, prevBlobs, dt, w)

                  prevBlobs = currBlobs



                  // 4. 내 이동 속도(myVel)까지 고려한 직선 궤도 예측 및 최적 회피 벡터 계산

                  val dodgePair = computeRelativeTrajectoryDodge(projectiles, myX, myY, myVelX, myVelY, myMaxSpeedPx, w)

                  val dodgeX = dodgePair.first

                  val dodgeY = dodgePair.second

                  val underThreat = hypot(dodgeX, dodgeY) > 0.05f



                  // 5. 빨간 원(적)의 위치 + 속도(v) + 가속도(a) 분석 및 내 이동 보정 2차 리드샷 계산

                  var aimX = 0f

                  var aimY = 0f

                  var shouldFire = false

                  var enemyDist = 9999f



                  if (redCnt >= 4) {

                      val ex = redSumX / redCnt

                      val ey = redSumY / redCnt

                      enemyDist = hypot(ex - myX, ey - myY)



                      if (prevEnemyX >= 0f) {

                          // 내가 움직여서 발생한 화면 상대 속도를 보정하여 적의 실제 속도 및 가속도 산출

                          val rawVx = (ex - prevEnemyX) / dt + myVelX * 0.35f

                          val rawVy = (ey - prevEnemyY) / dt + myVelY * 0.35f

                          val newVx = enemyVelX * 0.55f + rawVx * 0.45f

                          val newVy = enemyVelY * 0.55f + rawVy * 0.45f



                          // 이동 가속도 a = (v_new - v_old) / dt (급격한 노이즈 제한)

                          val rawAx = ((newVx - enemyVelX) / dt).coerceIn(-w * 0.8f, w * 0.8f)

                          val rawAy = ((newVy - enemyVelY) / dt).coerceIn(-h * 0.8f, h * 0.8f)

                          enemyAccX = enemyAccX * 0.6f + rawAx * 0.4f

                          enemyAccY = enemyAccY * 0.6f + rawAy * 0.4f



                          enemyVelX = newVx

                          enemyVelY = newVy

                      }

                      prevEnemyX = ex

                      prevEnemyY = ey



                      // 탄착 예상 시간 tHit 계산 후 등가속도 궤적 방정식 P_pred = P_e + v_e*t + 0.5*a_e*t^2 적용

                      val bulletSpeedPx = w * 0.62f

                      val tHit = (enemyDist / bulletSpeedPx).coerceIn(0f, 0.85f)

                      val predX = ex + enemyVelX * tHit + 0.5f * enemyAccX * tHit * tHit

                      val predY = ey + enemyVelY * tHit + 0.5f * enemyAccY * tHit * tHit



                      val aimAng = atan2(predY - myY, predX - myX)

                      aimX = cos(aimAng)

                      aimY = sin(aimAng)



                      // HP 관리 & 탄창 관리 수칙 적용:

                      // - 내 HP가 40% 미만이면 공격을 멈춰 브롤스타즈 자연 회복(3초 비전투 치유)을 유도! (단, 초근접 위기 제외)

                      // - 탄창이 1.0칸 이상 있을 때만 발사하며, 탄창이 1칸뿐일 때는 가속도가 낮은 확실한 타이밍에만 사격

                      val lowHpRetreat = myHpRatio < 0.40f && enemyDist > w * 0.18f

                      val enoughAmmo = myAmmoBars >= 0.95f

                      val highConfidenceShot = myAmmoBars >= 1.8f || hypot(enemyAccX, enemyAccY) < w * 0.35f



                      if (!lowHpRetreat && enoughAmmo && highConfidenceShot &&

                          enemyDist < w * 0.46f && (nowMs - lastFireMs) > 460L) {

                          shouldFire = true

                          lastFireMs = nowMs

                      }

                  }



                  // 6. HP 관리 및 탄창 상태에 따른 최종 무빙 벡터 결합

                  var tacticalX = cmdX

                  var tacticalY = cmdY

                  if (myHpRatio < 0.42f && redCnt >= 4 && enemyDist > 10f) {

                      // 체력이 낮을 때 적(빨간 원) 반대 방향으로 후퇴 벡터 추가 (HP 회복 관리)

                      val awayX = (myX - prevEnemyX) / enemyDist

                      val awayY = (myY - prevEnemyY) / enemyDist

                      tacticalX = cmdX * 0.4f + awayX * 0.6f

                      tacticalY = cmdY * 0.4f + awayY * 0.6f

                  }



                  var finalMoveX = if (underThreat) (dodgeX * 0.88f + tacticalX * 0.12f) else tacticalX

                  var finalMoveY = if (underThreat) (dodgeY * 0.88f + tacticalY * 0.12f) else tacticalY

                  val mLen = hypot(finalMoveX, finalMoveY)

                  if (mLen > 1f) {

                      finalMoveX /= mLen

                      finalMoveY /= mLen

                  }



                  lastAppliedMoveX = finalMoveX

                  lastAppliedMoveY = finalMoveY



                  // 오버레이 상태 텍스트 업데이트

                  val hpPct = (myHpRatio * 100).toInt().coerceIn(5, 100)

                  hpAmmoText?.text = "내 HP: ${hpPct}% | 탄창: ${String.format("%.1f", myAmmoBars)}칸"

                  hpAmmoText?.setTextColor(

                      if (hpPct < 40) Color.parseColor("#FB7185") else Color.parseColor("#34D399")

                  )



                  statusText?.text = when {

                      underThreat -> "⚡ 소형 고속탄 궤도 예측 회피 중!"

                      hpPct < 40 -> "🩹 저체력 HP 회복 관리 (사격 중지·후퇴)"

                      myAmmoBars < 1.0f -> "🔄 탄창 재장전 거리유지 무빙"

                      redCnt >= 4 -> "🎯 빨간원 가속도 궤적 리드샷 조준"

                      else -> "🕹️ 초록원(나) 이동 반영 · 전장 감시"

                  }



                  dispatchPadTouch(finalMoveX, finalMoveY, aimX, aimY, shouldFire, w.toFloat(), h.toFloat())

              }



              // 내 브롤러(초록 원) 상단의 HP 바와 주황색 3칸 탄창 바 픽셀 스캔

              private fun scanMyHpAndAmmoBars(bmp: Bitmap, cx: Float, cy: Float, w: Int, h: Int) {

                  val barWidth = (w * 0.055f).toInt().coerceAtLeast(36)

                  val hpY = (cy - h * 0.115f).toInt().coerceIn(10, h - 20)

                  val ammoY = (cy - h * 0.096f).toInt().coerceIn(10, h - 20)

                  val startX = (cx - barWidth / 2f).toInt().coerceIn(10, w - barWidth - 10)



                  var hpColoredPixels = 0

                  var ammoOrangePixels = 0

                  val samples = 18

                  val dxStep = max(1, barWidth / samples)



                  for (i in 0 until samples) {

                      val x = startX + i * dxStep

                      val cHp = bmp.getPixel(x, hpY)

                      val hr = Color.red(cHp)

                      val hg = Color.green(cHp)

                      val hb = Color.blue(cHp)

                      // 내 HP 바: 초록색(정상) 또는 노란/빨간색(피격 시) 밝은 픽셀 여부

                      if ((hg > 160 && hb < 110) || (hr > 180 && hg > 140 && hb < 90)) {

                          hpColoredPixels++

                      }



                      val cAm = bmp.getPixel(x, ammoY)

                      val ar = Color.red(cAm)

                      val ag = Color.green(cAm)

                      val ab = Color.blue(cAm)

                      // 주황색/노란색 3칸 탄창 바 픽셀 (R>195, G 85..210, B<80)

                      if (ar > 195 && ag in 85..215 && ab < 85) {

                          ammoOrangePixels++

                      }

                  }



                  if (hpColoredPixels > 2) {

                      val measuredHp = (hpColoredPixels.toFloat() / samples.toFloat()).coerceIn(0.1f, 1.0f)

                      myHpRatio = myHpRatio * 0.7f + measuredHp * 0.3f

                  }

                  val measuredAmmo = ((ammoOrangePixels.toFloat() / samples.toFloat()) * 3.0f).coerceIn(0f, 3.0f)

                  myAmmoBars = myAmmoBars * 0.6f + (if (ammoOrangePixels == 0) 2.0f else measuredAmmo) * 0.4f

              }



              // 크기가 작은 고속 객체만 클러스터링하여 탄환으로 추출 (큰 브롤러 몸체나 배경 이펙트 배제)

              private fun extractSmallProjectileBlobs(

                  mask: BooleanArray,

                  gridW: Int,

                  gridH: Int,

                  step: Int

              ): List<FastBlob> {

                  val visited = BooleanArray(mask.size)

                  val blobs = mutableListOf<FastBlob>()



                  for (gy in 2 until gridH - 2) {

                      for (gx in 2 until gridW - 2) {

                          val startIdx = gy * gridW + gx

                          if (!mask[startIdx] || visited[startIdx]) continue



                          var sumX = 0f

                          var sumY = 0f

                          var count = 0

                          val queue = IntArray(64)

                          var qHead = 0

                          var qTail = 0

                          queue[qTail++] = startIdx

                          visited[startIdx] = true



                          while (qHead < qTail && count < 45) {

                              val curr = queue[qHead++]

                              val cy = curr / gridW

                              val cx = curr % gridW

                              sumX += cx * step

                              sumY += cy * step

                              count++



                              for (ny in (cy - 1)..(cy + 1)) {

                                  for (nx in (cx - 1)..(cx + 1)) {

                                      if (nx in 1 until gridW - 1 && ny in 1 until gridH - 1) {

                                          val nIdx = ny * gridW + nx

                                          if (mask[nIdx] && !visited[nIdx] && qTail < queue.size) {

                                              visited[nIdx] = true

                                              queue[qTail++] = nIdx

                                          }

                                      }

                                  }

                              }

                          }



                          // 탄환 조건: 크기가 작고 응집된 블롭 (2개 ~ 22개 그리드 셀 이내)

                          if (count in 2..22) {

                              blobs.add(FastBlob(sumX / count, sumY / count, count))

                          }

                      }

                  }

                  return blobs

              }



              // 이전 프레임 소형 블롭과 매칭하여 일정 속도 이상으로 빠르게 날아오는 탄환만 직선 궤도 추적

              private fun matchAndTrackProjectiles(

                  currBlobs: List<FastBlob>,

                  oldBlobs: List<FastBlob>,

                  dt: Float,

                  screenW: Int

              ): List<TrackedProjectile> {

                  val minProjectileSpeed = screenW * 0.22f // 일정 속도 이상 고속 탄환 임계값

                  val maxJumpDist = screenW * 0.18f

                  val tracked = mutableListOf<TrackedProjectile>()



                  for (cb in currBlobs) {

                      var bestOld: FastBlob? = null

                      var bestDist = maxJumpDist

                      for (ob in oldBlobs) {

                          val d = hypot(cb.cx - ob.cx, cb.cy - ob.cy)

                          if (d < bestDist && d > 8f) {

                              bestDist = d

                              bestOld = ob

                          }

                      }

                      if (bestOld != null) {

                          val vx = (cb.cx - bestOld.cx) / dt

                          val vy = (cb.cy - bestOld.cy) / dt

                          val spd = hypot(vx, vy)

                          if (spd >= minProjectileSpeed) {

                              tracked.add(TrackedProjectile(cb.cx, cb.cy, vx, vy, spd))

                          }

                      }

                  }

                  return tracked

              }



              // 내 브롤러가 움직이는 속도(myVx, myVy)까지 고려한 상대 궤도 예측 및 최적 회피 방향 산출

              private fun computeRelativeTrajectoryDodge(

                  projectiles: List<TrackedProjectile>,

                  px: Float,

                  py: Float,

                  myVx: Float,

                  myVy: Float,

                  myMaxSpeed: Float,

                  screenW: Int

              ): Pair<Float, Float> {

                  if (projectiles.isEmpty()) return Pair(0f, 0f)

                  val safeRadius = screenW * 0.065f



                  // 내가 움직이는 상대 좌표계에서 위협 탄환 필터링

                  val threats = projectiles.filter { p ->

                      val relVx = p.vx - myVx

                      val relVy = p.vy - myVy

                      val relSpd = hypot(relVx, relVy).coerceAtLeast(1f)

                      val rx = px - p.x

                      val ry = py - p.y

                      val along = (rx * relVx + ry * relVy) / relSpd

                      if (along <= -20f || along > screenW * 0.42f) {

                          false

                      } else {

                          val cpaX = p.x + (relVx / relSpd) * max(0f, along)

                          val cpaY = p.y + (relVy / relSpd) * max(0f, along)

                          hypot(px - cpaX, py - cpaY) < safeRadius

                      }

                  }



                  if (threats.isEmpty()) return Pair(0f, 0f)



                  // 8방향 후보 이동 벡터 중 (내가 해당 방향으로 움직였을 때) 탄환 직선 궤도와의 최소 거리가 가장 먼 안전 방향 선택

                  var bestDirX = 0f

                  var bestDirY = 0f

                  var bestScore = -999999f



                  for (i in 0 until 8) {

                      val ang = (i * Math.PI / 4.0).toFloat()

                      val candUx = cos(ang)

                      val candUy = sin(ang)

                      val candVx = candUx * myMaxSpeed

                      val candVy = candUy * myMaxSpeed



                      var minClearance = 999999f

                      for (th in threats) {

                          // 후보 이동 시 상대 속도 v_rel = v_proj - v_cand

                          val rvx = th.vx - candVx

                          val rvy = th.vy - candVy

                          val rSpd = hypot(rvx, rvy).coerceAtLeast(1f)

                          val rx = px - th.x

                          val ry = py - th.y

                          val along = ((rx * rvx + ry * rvy) / rSpd).coerceIn(0f, screenW * 0.4f)

                          val cpaX = th.x + (rvx / rSpd) * along

                          val cpaY = th.y + (rvy / rSpd) * along

                          val distAtCpa = hypot(px - cpaX, py - cpaY)

                          if (distAtCpa < minClearance) minClearance = distAtCpa

                      }



                      // 상단 스틱 지시 방향(cmdX, cmdY)과의 일치도 보너스 합산

                      val userAlign = (candUx * cmdX + candUy * cmdY) * 28f

                      val totalScore = minClearance + userAlign

                      if (totalScore > bestScore) {

                          bestScore = totalScore

                          bestDirX = candUx

                          bestDirY = candUy

                      }

                  }



                  return Pair(bestDirX, bestDirY)

              }



              private fun dispatchPadTouch(

                  mx: Float, my: Float,

                  ax: Float, ay: Float,

                  fire: Boolean,

                  screenW: Float = 2400f,

                  screenH: Float = 1080f

              ) {

                  if (!aiActive) return

                  val leftPadX = screenW * 0.14f

                  val leftPadY = screenH * 0.78f

                  val rightPadX = screenW * 0.86f

                  val rightPadY = screenH * 0.78f

                  val dragR = screenH * 0.11f



                  val builder = GestureDescription.Builder()

                  var hasStroke = false



                  if (hypot(mx, my) > 0.08f) {

                      val movePath = Path().apply {

                          moveTo(leftPadX, leftPadY)

                          lineTo(leftPadX + mx * dragR, leftPadY + my * dragR)

                      }

                      builder.addStroke(GestureDescription.StrokeDescription(movePath, 0L, 80L, false))

                      hasStroke = true

                  }



                  if (fire && hypot(ax, ay) > 0.1f) {

                      val aimPath = Path().apply {

                          moveTo(rightPadX, rightPadY)

                          lineTo(rightPadX + ax * dragR, rightPadY + ay * dragR)

                      }

                      builder.addStroke(GestureDescription.StrokeDescription(aimPath, 0L, 60L, false))

                      hasStroke = true

                  }



                  if (hasStroke) {

                      dispatchGesture(builder.build(), null, null)

                  }

              }

          }

          ''')

          print("Android v2 source generated successfully.")

