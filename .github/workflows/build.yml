      - name: Setup Gradle

        uses: gradle/actions/setup-gradle@v3

        with:

          gradle-version: '8.5'



      - name: Build Debug APK

        run: gradle assembleDebug



      - name: Rename APK for Easy Download

        run: cp app/build/outputs/apk/debug/app-debug.apk Brawl_AI_Overlay.apk



      - name: Upload APK to Actions Tab

        uses: actions/upload-artifact@v4

        with:

          name: Brawl_AI_Overlay_APK

          path: Brawl_AI_Overlay.apk



      - name: Publish APK to GitHub Releases

        continue-on-error: true

        env:

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          gh release delete v2.0 --yes || true

          gh release create v2.0 Brawl_AI_Overlay.apk --title "Brawl AI Overlay v2.0 설치파일 (APK)" --notes "초록/파랑/빨강 원 분리 인식 + 가속도 2차 궤적 에임 + 소형 고속탄 & 내 이동 반영 회피 + HP/탄창 관리 적용 버전"

